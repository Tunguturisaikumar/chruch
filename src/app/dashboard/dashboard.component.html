<div class="dashboard">

  <!-- Header -->
  <header class="header">

    <div class="title">
      <img src="./assets/logo.jpg"
           alt="logo"
           width="120">
    </div>

    <button
      class="logout-btn"
      (click)="logout()">

      Logout

    </button>

  </header>


  <div class="cards-grid">

    <!-- Chat Interval -->
    <div class="control-card">

      <h3>Chat Interval</h3>

      <input
        type="number"
        class="form-control"
        [(ngModel)]="tempChatInterval">

      <button
        class="btn btn-success mt-3"
        (click)="saveChatInterval()">

        Save

      </button>

      <p class="mt-2">
        Current : {{ chatInterval }}
      </p>

    </div>


    <!-- Reading Interval -->
    <div class="control-card">

      <h3>Reading Interval</h3>

      <input
        type="number"
        class="form-control"
        [(ngModel)]="tempReadingInterval">

      <button
        class="btn btn-success mt-3"
        (click)="saveReadingInterval()">

        Save

      </button>

      <p class="mt-2">
        Current : {{ readingInterval }}
      </p>

    </div>


    <!-- Study Interval -->
    <div class="control-card">

      <h3>Study Interval</h3>

      <input
        type="number"
        class="form-control"
        [(ngModel)]="tempStudyInterval">

      <button
        class="btn btn-success mt-3"
        (click)="saveStudyInterval()">

        Save

      </button>

      <p class="mt-2">
        Current : {{ studyInterval }}
      </p>

    </div>


    <!-- Website Interval -->
    <div class="control-card">

      <h3>Website Interval</h3>

      <input
        type="number"
        class="form-control"
        [(ngModel)]="tempWebsiteInterval">

      <button
        class="btn btn-success mt-3"
        (click)="saveWebsiteInterval()">

        Save

      </button>

      <p class="mt-2">
        Current : {{ websiteInterval }}
      </p>

    </div>

  </div>

</div>

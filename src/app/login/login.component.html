<div class="login-popup">
  <!-- In-card loader overlay with smooth transition -->
  <div *ngIf="loading" class="login-card-loader">
    <div class="spinner-ring"></div>
    <p class="loader-text">Verifying credentials...</p>
  </div>

  <div class="login-header">
    <h2>Admin Login</h2>
    <button class="close-btn" type="button" [disabled]="loading" (click)="closePopup()" aria-label="Close">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <form (ngSubmit)="login()" autocomplete="on">
    <div class="mb-3 form-group">
      <label class="form-label">Username</label>
      <div class="input-wrapper">
        <i class="fas fa-user input-icon"></i>
        <input
          type="text"
          class="form-control with-icon"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          [disabled]="loading"
          required>
      </div>
      <small class="text-danger mt-1 d-block" *ngIf="submitted && !username">
        Username is required
      </small>
    </div>

    <div class="mb-4 form-group">
      <label class="form-label">Password</label>
      <div class="input-wrapper password-wrapper">
        <i class="fas fa-lock input-icon"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control with-icon with-toggle"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          [disabled]="loading"
          required>
        <button
          type="button"
          class="password-toggle-btn"
          (click)="togglePasswordVisibility()"
          [disabled]="loading"
          [title]="showPassword ? 'Hide password' : 'Show password'"
          aria-label="Toggle password visibility">
          <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
      </div>
      <small class="text-danger mt-1 d-block" *ngIf="submitted && !password">
        Password is required
      </small>
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100 login-btn"
      [disabled]="loading">
      <i *ngIf="loading" class="fas fa-circle-notch fa-spin me-2"></i>
      <span>{{ loading ? 'Signing in...' : 'Login' }}</span>
    </button>
  </form>
</div>
